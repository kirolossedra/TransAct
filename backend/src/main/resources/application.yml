server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/transact}
    username: ${DATABASE_USERNAME:transact}
    password: ${DATABASE_PASSWORD:transact}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

transact:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    developer-password: ${TRANSACT_DEVELOPER_PASSWORD:dev-demo}
    admin-password: ${TRANSACT_ADMIN_PASSWORD:admin-demo}
  loans:
    review-period-days: ${LOAN_REVIEW_PERIOD_DAYS:3}
  salary:
    scheduler-ms: ${SALARY_SCHEDULER_MS:60000}
