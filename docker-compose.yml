services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transact
      POSTGRES_USER: transact
      POSTGRES_PASSWORD: transact
    ports:
      - "5432:5432"
    volumes:
      - transact_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transact -d transact"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/transact
      DATABASE_USERNAME: transact
      DATABASE_PASSWORD: transact
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TRANSACT_DEVELOPER_PASSWORD: dev-demo
      TRANSACT_ADMIN_PASSWORD: admin-demo
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  transact_postgres:
